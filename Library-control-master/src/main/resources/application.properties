spring.application.name=LibraryControl

# Local default: H2. Render: set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
# SPRING_DATASOURCE_PASSWORD and SPRING_JPA_DATABASE_PLATFORM via Render environment.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./librarydb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false
server.address=0.0.0.0
server.port=${PORT:8080}
